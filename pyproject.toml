[project]
name = "transcript"
version = "0.3.1"
description = "Локальный транскрибатор аудио/видео/YouTube с диаризацией, переводом и саммари"
# Изучать, менять и делиться — свободно; зарабатывать этим — нет. Готовый текст,
# а не свой: слово «некоммерческое» без определения толкуется как угодно, а
# PolyForm его определяет, и там же прямо разрешены правки и производные работы.
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    # ASR на Metal. Колёса mlx собираются только под macOS arm64, поэтому без
    # маркера установка на Windows и Linux падает на разрешении зависимостей.
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Локальная LLM для перевода и саммари — там же и по той же причине.
    "mlx-lm>=0.28; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Везде, кроме Apple Silicon, ASR идёт через CTranslate2: на NVIDIA это CUDA,
    # на остальных машинах — процессор.
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
    # Там же LLM-бэкендом становится Ollama, поэтому её клиент обязателен: иначе
    # установка по умолчанию даёт конфигурацию, которая падает на первом переводе.
    # Это тонкий HTTP-клиент, сам демон ставится отдельным инсталлятором.
    "ollama>=0.4; sys_platform != 'darwin' or platform_machine != 'arm64'",
    # Разговор с LLM, поднятой на другой машине. Приезжает и транзитивно с
    # huggingface-hub, но полагаться на чужую зависимость нельзя: пропадёт она —
    # отвалится перевод.
    "httpx>=0.27",
    # Диаризация «кто когда говорит». Два бэкенда: sherpa работает на открытых
    # моделях и потому стоит умолчанием, pyannote точнее на редких репликах, но
    # требует принять условия и получить токен — за человека этого никто не сделает.
    "sherpa-onnx>=1.13",
    "pyannote.audio>=4.0",
    "torch>=2.5",
    "torchaudio>=2.5",
    # VAD — без него Whisper галлюцинирует на тишине и музыке
    "silero-vad>=5.1",
    # Загрузка с YouTube и прочих площадок. Нижняя граница — из замера, а не из
    # даты сборки: на 2026.7.4 лекция M6QCn9SCaGQ бралась клиентом «android vr»,
    # метаданные приходили, а ссылка на дорожку была мёртвой — «HTTP Error 403:
    # Forbidden». На 2026.8.19 та же ссылка идёт через «visionos» и качается
    # целиком: 46 МБ, 25.09.2026 (JS-задачу этот клиент не спрашивает — решатель
    # в подробном журнале не вызывался ни разу из трёх). YouTube закрывает старые
    # пути и дальше, так что граница не последняя — 403 на живой ссылке значит
    # сначала посмотреть версию, а уже потом куки. Уже стоящий yt-dlp окно
    # обновляет само — `yt_dlp_updates`.
    "yt-dlp>=2026.8.19",
    # Без этих двух YouTube отдаёт одни картинки-раскадровки. Он требует решить
    # JS-задачу («n challenge»), а для неё нужны движок JavaScript и сам скрипт
    # решателя; без них yt-dlp предупреждает и молча возвращает список без единой
    # звуковой дорожки, а приложение показывает «Requested format is not
    # available» — сообщение, по которому причину не угадать.
    #
    # Deno, а не уже стоящий у кого-то Node: yt-dlp по умолчанию включает только
    # его, остальные движки нужно называть флагом. Приезжает пакетом с колесом на
    # каждую систему — 40 МБ закачки, 93 МБ на диске. Дорого для тех, кто ссылок
    # не открывает, но дешевле, чем «из коробки не работает».
    #
    # Скрипт решателя тоже пакетом, а не закачкой на лету: yt-dlp умеет тянуть
    # его сам с GitHub, но тогда каждая чистая установка ходила бы за ним в сеть
    # в первый же раз — и в сборке, которая обещает работать целиком из папки.
    "deno>=2.9",
    "yt-dlp-ejs>=0.8",
    # Запасные ffmpeg и ffprobe: статические сборки без внешних зависимостей.
    # Системные всё равно идут первыми — они свежее, — но без этого пакета
    # приложение упиралось бы в `brew install ffmpeg` ещё до первого файла, а
    # окно, запущенное из Finder, не наследует PATH оболочки и не увидело бы
    # даже установленный. Около 160 МБ на два бинаря, зато из коробки.
    "ffmpeg-binaries>=1.0",
    # Работа с аудио
    "soundfile>=0.13",
    "numpy>=2.0",
    # CLI и конфиг
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
# CTranslate2 на macOS: Metal он не умеет, поэтому там это осознанный выбор
# ради настоящего beam search, которого нет в mlx-whisper.
faster = ["faster-whisper>=1.1"]
# cuBLAS двенадцатой версии для Windows с картой: CTranslate2 4.8 просит
# `cublas64_12.dll`, а колесо torch канала cu130 несёт тринадцатую. Без пакета
# модель собирается молча, а падает первый же счёт — и лекция считается на
# процессоре вместо карты, в тринадцать раз дольше.
#
# Экстрой, а не зависимостью: 736 МБ, и машине без карты они не нужны ничем.
# Маркер оставляет её пустой на остальных системах: колёс `nvidia-*` под macOS
# не собирают вовсе, и без него `.[cuda]` там не разрешился бы.
cuda = ["nvidia-cublas-cu12>=12,<13; sys_platform == 'win32'"]
# На Apple Silicon Ollama не нужна — там LLM считает mlx. Экстра оставлена для
# тех, у кого демон уже поднят и хочется использовать его.
ollama = ["ollama>=0.4"]
# Десктопное окно. Системный webview вместо своего браузера: WKWebView на macOS,
# WebView2 на Windows — около мегабайта против полутора сотен у Electron.
app = ["pywebview>=6.0"]
# PDF и DOCX. Экстра существовала только в тексте ошибки — сообщение звало
# поставить `.[documents]`, которой не было, а сами библиотеки держались на том,
# что их поставили руками. В выпущенном приложении их не было вовсе: лаунчер
# ставит `[app]`, и обе кнопки отказывали у всех, кроме автора.
#
# matplotlib здесь ради `mathtext`: он набирает формулу картинкой, потому что ни
# reportlab, ни Word чужой математики не принимают. Он же приезжает транзитивно
# с pyannote, но полагаться на чужую зависимость нельзя — уйдёт она, отвалятся
# формулы в документах.
documents = ["reportlab>=4.0", "python-docx>=1.1", "matplotlib>=3.8"]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
transcript = "transcriber.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
